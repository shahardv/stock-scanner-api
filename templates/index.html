<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>US Stock Scanner</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>US Stock Scanner</h1>
        <p class="subtitle">S&P 500 stocks near their Simple Moving Average</p>
    </header>

    <main>
        <!-- Scan Controls -->
        <section id="controls">
            <div class="control-group">
                <label for="sma-period">SMA Period:</label>
                <select id="sma-period">
                    <option value="20">20 days</option>
                    <option value="50">50 days</option>
                    <option value="100">100 days</option>
                    <option value="150" selected>150 days</option>
                    <option value="200">200 days</option>
                </select>
            </div>
            <div class="control-group">
                <label for="threshold">Proximity Threshold:</label>
                <input type="range" id="threshold" min="1" max="10" step="0.5" value="5">
                <span id="threshold-value">5.0%</span>
            </div>
            <p class="hint">Stocks within the threshold % of their SMA will be shown</p>
            <button id="scan-btn">Scan S&P 500</button>
        </section>

        <!-- Progress -->
        <section id="progress" class="hidden">
            <div class="progress-bar-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>
            <p id="progress-message">Initializing...</p>
        </section>

        <!-- Results -->
        <section id="results" class="hidden">
            <div id="results-summary"></div>
            <div class="table-controls">
                <input type="text" id="filter-input" placeholder="Filter by ticker, name, or sector...">
            </div>
            <div class="table-container">
                <table id="results-table">
                    <thead></thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
